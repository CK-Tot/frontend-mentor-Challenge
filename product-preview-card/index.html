<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Preview Card</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="..." crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="product-card">
       <div class="left">
        <picture>
            <source srcset="/product-preview-cardproduct-preview-card/assets/Apple-iPhone-18-Pro.webp" media="max-width: 540px">
            <img src="/product-preview-card/assets/Apple-iPhone-18-Pro.webp" alt="iPhone 18 Pro">
        </picture>
       </div>
       <div class="right">
            <p class="iphone">iPhone</p>
            <h1>Shop iPhone 18 Pro</h1>
            <p class="description">Your new iPhone comes with so much more.</p>
            <div class="pricing">
                <p class="new-price">$1,999</p>
                <p class="old-price">$2,999</p>
            </div>
            <button class="cart-btn">
                    <i class="fa-solid fa-cart-shopping"></i>
                    Add to cart
                </button>
        </div>
    </div>
    
</body>
</html>
